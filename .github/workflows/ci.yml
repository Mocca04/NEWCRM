name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newcrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newcrm
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newcrm_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crear base sombra
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE newcrm_shadow'
      - name: Validar esquema Prisma
        run: pnpm --filter @newcrm/database validate
      - name: Generar cliente Prisma
        run: pnpm --filter @newcrm/database generate
      - name: Publicar el cliente generado en la rama prisma-client
        # El entorno de desarrollo asistido no puede descargar los motores de
        # Prisma; toma el cliente ya generado de esta rama.
        if: github.ref == 'refs/heads/main'
        working-directory: packages/database/src/generated
        run: |
          git init -q -b prisma-client
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Cliente Prisma generado de $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prisma-client
      - name: Aplicar migraciones con Prisma sobre una base vacia
        run: pnpm --filter @newcrm/database migrate
      - name: Verificar que las migraciones coinciden con schema.prisma
        run: pnpm --filter @newcrm/database migrate:check
      - name: Compilar la web
        run: pnpm --filter @newcrm/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54399
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: llave-de-pruebas
          NEXT_TELEMETRY_DISABLED: 1
      - name: Revision de tipos
        run: pnpm typecheck
      - name: Pruebas contra PostgreSQL
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Recorrido de punta a punta en navegador
        run: pnpm --filter @newcrm/web e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          E2E_REBUILD: 1

  api-image:
    # Comprueba que la imagen de la API se construye y arranca.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newcrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -f apps/api/Dockerfile -t newcrm-api .
      - name: Arrancar y consultar el estado
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/newcrm \
            -e SUPABASE_URL=https://ejemplo.supabase.co -e PORT=3001 newcrm-api
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
